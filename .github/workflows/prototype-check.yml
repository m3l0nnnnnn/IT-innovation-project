name: Estara prototype verification

on:
  push:
    branches:
      - feature/full-prototype-workspaces
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck backend and frontend
        run: npm run check
      - name: Backend unit tests
        run: npm test
      - name: Production build
        run: npm run build
